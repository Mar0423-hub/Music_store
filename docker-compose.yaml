version: '3.8'

services:
  music-shop:
    build: .
    container_name: music-shop-app
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - PYTHONUNBUFFERED=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/app/data
      - ./logs:/app/logs
    network_mode: bridge  # ← ИЗМЕНИТЬ с host на bridge
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:  # ← ДОБАВИТЬ зависимости
      - redis

  redis:
    image: redis:7-alpine
    container_name: music-shop-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    container_name: music-shop-adminer
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - redis
